      @keyframes feum-outer-glow {

      /* ════════════════════════════════════════════════════
         MOBILE OVERRIDES  (max-width: 767px)
         ════════════════════════════════════════════════════ */
      @media (max-width: 767px) {

        /* Hide scrollbar */
        ::-webkit-scrollbar { display: none !important; }
        body { -ms-overflow-style: none !important; scrollbar-width: none !important; }

        /* ── 1. Selected Work — 2-column grid ────────────── */
        .grid.gap-y-14 {
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
          gap: 0.5rem !important;
        }
        /* Keep thumbnail aspect-video, smaller text */
        .grid.gap-y-14 h3 {
          font-size: 12px !important;
          white-space: nowrap !important;
          overflow: hidden !important;
          text-overflow: ellipsis !important;
        }

        /* ── 2. Toolkit — single horizontal row, icon only ─ */
        .toolkit-glow ~ div ul {
          grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
          gap: 0 !important;
        }
        .toolkit-glow ~ div ul li {
          padding: 0.875rem 0.25rem !important;
          justify-content: center !important;
          flex-direction: row !important;
          gap: 0 !important;
        }
        /* Hide the name text on mobile */
        .toolkit-glow ~ div ul li span.truncate {
          display: none !important;
        }
        /* Tooltip shown on hover / tap-and-hold */
        .toolkit-glow ~ div ul li {
          position: relative !important;
        }
        .toolkit-glow ~ div ul li[data-tool]:hover::after,
        .toolkit-glow ~ div ul li[data-tool]:active::after {
          content: attr(data-tool);
          position: absolute;
          bottom: calc(100% + 6px);
          left: 50%;
          transform: translateX(-50%);
          background: rgba(10, 10, 18, 0.96);
          border: 1px solid rgba(255, 255, 255, 0.18);
          color: #fff;
          font-size: 11px;
          font-weight: 600;
          font-family: 'Satoshi', 'Inter', sans-serif;
          padding: 5px 11px;
          border-radius: 7px;
          white-space: nowrap;
          z-index: 200;
          pointer-events: none;
          animation: feum-tooltip-in 0.15s ease forwards;
        }
        @keyframes feum-tooltip-in {
          from { opacity: 0; transform: translateX(-50%) translateY(3px); }
          to   { opacity: 1; transform: translateX(-50%) translateY(0);   }
        }

        /* ── 3. "Trusted by creators" — badge beside text ── */

          font-size: 1.875rem !important;

          overflow-x: auto !important;
          justify-content: flex-start !important;
          padding: 0 1.25rem 0.5rem !important;
          gap: 0.4rem !important;
          -webkit-overflow-scrolling: touch !important;
          scrollbar-width: none !important;
        }
        ul.flex.flex-wrap.justify-center.gap-3::-webkit-scrollbar {

        /* Compact social buttons */

          font-size: 0.7rem !important;

        ul.flex.flex-wrap.justify-center.gap-3 a span:first-child {

        /* ── Beyond Thumbnails 3-col grid ────────────────── */

    <!-- Right-click / DevTools protection -->
    <script>
      (function(){
        try {
          document.addEventListener('contextmenu', function(e){ e.preventDefault(); }, { capture: true });
          document.addEventListener('dragstart', function(e){
            var t = e.target;
            if (t && (t.tagName === 'IMG' || t.tagName === 'VIDEO')) e.preventDefault();
          }, { capture: true });
          document.addEventListener('keydown', function(e){
            var k = (e.key || '').toLowerCase();
            var ctrl = e.ctrlKey || e.metaKey;
            if (e.key === 'F12') e.preventDefault();
            if (ctrl && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) e.preventDefault();
            if (ctrl && (k === 'u' || k === 's')) e.preventDefault();
          }, { capture: true });
        } catch(_){}
      })();
    </script>

    <!-- Creator card injection (fast bootstrap — also in feum-edits.js as fallback) -->
    <script>
      (function() {
        var newCreators = [
          {
            name: 'Icynutella',
            subs: '39.7K Subscribers',
            url: 'https://youtube.com/@icynutella',
            img: 'https://yt3.googleusercontent.com/pOdPN9SZ13Dy6pumjp5jl_vBA4-xHP7Vh55kqG1On8zvCg1Bb2PUAUmk81rIFXxR1Qus8N2I0A=s200-c-k-c0x00ffffff-no-rj',
            glow: 'rgba(56, 189, 248, 0.55)'
          },
          {
            name: 'Icynutella2',
            subs: '8.77K Subscribers',
            url: 'https://youtube.com/@icynutella2',
            img: 'https://yt3.googleusercontent.com/bzcNeMUIU7iD_Bb67Q5YYNlCnW9q8TvpKeLeBk14_i1_UaRly6Yqg-jA4RZ_th_klG0jmkZycUQ=s200-c-k-c0x00ffffff-no-rj',
            glow: 'rgba(34, 211, 238, 0.55)'
          }
        ];

        function createCard(creator) {
          var a = document.createElement('a');
          a.href = creator.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.className = 'liquid-glass group flex items-center gap-5 px-7 md:px-8 py-4 md:py-5 rounded-full shrink-0';
          a.innerHTML =
            '<span class="relative inline-flex items-center justify-center shrink-0">' +
              '<span aria-hidden="true" class="absolute inset-0 rounded-full blur-md" style="background-color:' + creator.glow + ';opacity:0.65;"></span>' +
              '<img src="' + creator.img + '" alt="' + creator.name + '" loading="lazy" class="relative w-14 h-14 md:w-16 md:h-16 rounded-full object-cover ring-1 ring-white/15 group-hover:ring-white/30 transition-shadow duration-300" />' +
            '</span>' +
            '<span class="flex flex-col">' +
              '<span class="font-semibold text-sm">' + creator.name + '</span>' +
              '<span class="text-xs text-muted-foreground">' + creator.subs + '</span>' +
            '</span>';
          return a;
        }

        function injectCreators() {
          var containers = document.querySelectorAll('.w-max');
          var injected = false;
          containers.forEach(function(container) {
            if (container.hasAttribute('data-ci')) return;
            var links = Array.from(container.querySelectorAll('a.liquid-glass'));
            if (links.length < 4) return;
            container.setAttribute('data-ci', '1');
            var groupSize = 4;
            var numGroups = Math.floor(links.length / groupSize);
            for (var r = numGroups - 1; r >= 0; r--) {
              var insertAfter = links[r * groupSize + groupSize - 1];
              newCreators.slice().reverse().forEach(function(creator) {
                insertAfter.insertAdjacentElement('afterend', createCard(creator));
              });
            }
            injected = true;
          });
          return injected;
        }

        var attempts = 0;
        function poll() {
          var container = document.querySelector('.w-max');
          if (container && container.querySelectorAll('a').length >= 4) {
            injectCreators();
            return;
          }
          if (++attempts < 60) setTimeout(poll, 250);
        }
        if (document.readyState === 'complete') poll();
        else window.addEventListener('load', poll);

        /* Live sub-count fetch */
        function formatSubs(raw) {
          var m = raw.match(/([\d.]+)\s*([KMB]?)\s*subscriber/i);
          if (!m) return null;
          return m[1] + (m[2] ? m[2].toUpperCase() : '') + ' Subscribers';
        }
        function updateSubCount(name, count) {
          document.querySelectorAll('a.liquid-glass').forEach(function(card) {
            var nameEl = card.querySelector('span.font-semibold');
            var subEl  = card.querySelector('span.text-muted-foreground');
            if (nameEl && subEl && nameEl.textContent.trim() === name) subEl.textContent = count;
          });
        }
        function fetchSubs(handle, displayName) {
          var proxy = 'https://corsproxy.io/?url=' + encodeURIComponent('https://www.youtube.com/@' + handle);
          fetch(proxy)
            .then(function(r) { return r.text(); })
            .then(function(html) {
              var m = html.match(/"([\d.]+\s*[KMB]?\s*subscriber[^"]*?)"/i);
              if (m) { var c = formatSubs(m[1]); if (c) updateSubCount(displayName, c); }
            }).catch(function() {});
        }
        window.addEventListener('load', function() {
          setTimeout(function() {
            fetchSubs('icynutella',  'Icynutella');
            fetchSubs('icynutella2', 'Icynutella2');
          }, 1500);
        });
      })();
    </script>

    <!-- Nav icon removal -->
    <script>

          document.querySelectorAll('a.feum-nav-link svg').forEach(function(svg) { svg.remove(); });

        var attempts = 0;
        function poll() {
          if (document.querySelector('a.feum-nav-link')) removeNavIcons();
          else if (++attempts < 40) setTimeout(poll, 150);
        }
        if (document.readyState === 'complete') poll();
        else window.addEventListener('load', poll);
      })();
    </script>
