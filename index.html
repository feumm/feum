    <script>
      (function() {
        var newCreators = [
          {
            name: 'Icynutella',
            subs: '39.7K Subscribers',
            url: 'https://youtube.com/@icynutella',
            img: 'https://yt3.googleusercontent.com/pOdPN9SZ13Dy6pumjp5jl_vBA4-xHP7Vh55kqG1On8zvCg1Bb2PUAUmk81rIFXxR1Qus8N2I0A=s200-c-k-c0x00ffffff-no-rj',
            glow: 'rgba(56, 189, 248, 0.55)'
          },
          {
            name: 'Icynutella2',
            subs: '8.77K Subscribers',
            url: 'https://youtube.com/@icynutella2',
            img: 'https://yt3.googleusercontent.com/bzcNeMUIU7iD_Bb67Q5YYNlCnW9q8TvpKeLeBk14_i1_UaRly6Yqg-jA4RZ_th_klG0jmkZycUQ=s200-c-k-c0x00ffffff-no-rj',
            glow: 'rgba(34, 211, 238, 0.55)'
          }
        ];

        function createCard(creator) {
          var a = document.createElement('a');
          a.href = creator.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.className = 'liquid-glass group flex items-center gap-5 px-7 md:px-8 py-4 md:py-5 rounded-full shrink-0';
          a.innerHTML =
            '<span class="relative inline-flex items-center justify-center shrink-0">' +
              '<span aria-hidden="true" class="absolute inset-0 rounded-full blur-md" style="background-color:' + creator.glow + ';opacity:0.65;"></span>' +
              '<img src="' + creator.img + '" alt="' + creator.name + '" loading="lazy" class="relative w-14 h-14 md:w-16 md:h-16 rounded-full object-cover ring-1 ring-white/15 group-hover:ring-white/30 transition-shadow duration-300" />' +
            '</span>' +
            '<span class="flex flex-col">' +
              '<span class="font-semibold text-sm">' + creator.name + '</span>' +
              '<span class="text-xs text-muted-foreground">' + creator.subs + '</span>' +
            '</span>';
          return a;
        }

        function injectCreators() {
          var containers = document.querySelectorAll('.w-max');
          var injected = false;
          containers.forEach(function(container) {
            var links = Array.from(container.querySelectorAll('a.liquid-glass'));
            if (links.length < 4) return;
            var groupSize = 4;
            var numGroups = Math.floor(links.length / groupSize);
            for (var r = numGroups - 1; r >= 0; r--) {
              var insertAfter = links[r * groupSize + groupSize - 1];
              newCreators.slice().reverse().forEach(function(creator) {
                insertAfter.insertAdjacentElement('afterend', createCard(creator));
              });
            }
            injected = true;
          });
          return injected;
        }

        var attempts = 0;
        function poll() {
          var container = document.querySelector('.w-max');
          if (container && container.querySelectorAll('a').length >= 4) {
            injectCreators();
            return;
          }
          if (++attempts < 60) setTimeout(poll, 250);
        }

        if (document.readyState === 'complete') {
          poll();
        } else {
          window.addEventListener('load', poll);
        }

        var channelHandles = {
          'icynutella':  { url: 'https://youtube.com/@icynutella',  selector: 'Icynutella'  },
          'icynutella2': { url: 'https://youtube.com/@icynutella2', selector: 'Icynutella2' }
        };

        function formatSubs(raw) {
          var m = raw.match(/([\d.]+)\s*([KMB]?)\s*subscriber/i);
          if (!m) return null;
          return m[1] + (m[2] ? m[2].toUpperCase() : '') + ' Subscribers';
        }

        function updateSubCount(name, count) {
          document.querySelectorAll('a.liquid-glass').forEach(function(card) {
            var nameEl = card.querySelector('span.font-semibold');
            var subEl  = card.querySelector('span.text-muted-foreground');
            if (nameEl && subEl && nameEl.textContent.trim() === name) {
              subEl.textContent = count;
            }
          });
        }

        function fetchSubs(handle, displayName) {
          var proxy = 'https://corsproxy.io/?url=' + encodeURIComponent('https://www.youtube.com/@' + handle);
          fetch(proxy)
            .then(function(r) { return r.text(); })
            .then(function(html) {
              var m = html.match(/"([\d.]+\s*[KMB]?\s*subscriber[^"]*?)"/i);
              if (m) {
                var count = formatSubs(m[1]);
                if (count) updateSubCount(displayName, count);
              }
            })
            .catch(function() {});
        }

        window.addEventListener('load', function() {
          setTimeout(function() {
            fetchSubs('icynutella',  'Icynutella');
            fetchSubs('icynutella2', 'Icynutella2');
          }, 1500);
        });
      })();
    </script>
