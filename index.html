        function createCard(creator) {
          var a = document.createElement('a');

          a.className = 'liquid-glass group flex items-center gap-5 px-7 md:px-8 py-4 md:py-5 rounded-full shrink-0';

            '</span>';

        function injectCreators() {
          var containers = document.querySelectorAll('.w-max');
          containers.forEach(function(container) {
            if (container.hasAttribute('data-ci')) return;
            var links = Array.from(container.querySelectorAll('a.liquid-glass'));
            if (links.length < 4) return;
            container.setAttribute('data-ci', '1');
            var groupSize = 4;
            var numGroups = Math.floor(links.length / groupSize);
            for (var r = numGroups - 1; r >= 0; r--) {
              var groupLinks = links.slice(r * groupSize, (r + 1) * groupSize);
              var sharpnessCard = groupLinks.find(function(l) {

              if (sharpnessCard && reddoonsCreator) {
                sharpnessCard.insertAdjacentElement('afterend', createCard(reddoonsCreator));
              }

              var insertAfter = groupLinks[groupLinks.length - 1];
              otherCreators.slice().reverse().forEach(function(creator) {
                insertAfter.insertAdjacentElement('afterend', createCard(creator));
              });
            }
          });

        function formatSubs(raw) {
          var m = raw.match(/([\d.]+)\s*([KMB]?)\s*subscriber/i);

            var subEl  = card.querySelector('span.text-muted-foreground');
            if (nameEl && subEl && nameEl.textContent.trim() === name) subEl.textContent = count;
          });
        }
        function fetchSubs(handle, displayName) {
          var proxy = 'https://corsproxy.io/?url=' + encodeURIComponent('https://www.youtube.com/@' + handle);

            .then(function(html) {

            }).catch(function() {});

    <script>
      (function() {
        var startTime = Date.now();
        var minDisplayTime = 700;
        
        function dismissPreloader() {
          var preloader = document.getElementById('site-preloader');
          if (!preloader || preloader.classList.contains('preloader-hidden')) return;
          
          var elapsed = Date.now() - startTime;
          var delay = Math.max(0, minDisplayTime - elapsed);
          
          setTimeout(function() {
            preloader.classList.add('preloader-hidden');
            setTimeout(function() {
              if (preloader && preloader.parentNode) preloader.remove();
            }, 700);
          }, delay);
        }

        if (document.readyState === 'complete') {
          dismissPreloader();
        } else {
          window.addEventListener('load', dismissPreloader);
          setTimeout(dismissPreloader, 3500);
        }
      })();
