<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <title>Video Editings — fre</title>
    <meta name="description" content="High-retention video edits, cinematic, sound design, and Minecraft animations by fre." />
    <meta name="keywords" content="video editing, minecraft animation, gaming edits, fre, youtube video editor, minecraft cinematic" />
    <meta name="author" content="fre" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Video Editings — fre" />
    <meta property="og:description" content="High-retention video edits, cinematic pacing, and Minecraft animations by fre." />
    <meta property="og:url" content="https://feumm.github.io/feum/video-gallery.html" />
    <meta property="og:image" content="./assets/opengraph.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Video Editings — fre" />
    <meta name="twitter:description" content="High-retention video edits and Minecraft animations by fre." />
    <meta name="twitter:image" content="./assets/opengraph.jpg" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./perf.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&family=Archivo:ital,wght@1,800&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,600,700,800,900&f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600;1,800&display=swap" rel="stylesheet">

    <style>
      @font-face {
        font-family: 'OpenSans';
        src: url('./fonts/OpenSans-ExtraBold.ttf') format('truetype');
        font-weight: 800;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'OpenSans';
        src: url('./fonts/OpenSans-Semibold.ttf') format('truetype');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'OpenSans';
        src: url('./fonts/OpenSans-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.2) #000000;
      }

      :root, html, body {
        color-scheme: dark;
      }

      /* Custom Sleek Dark Scrollbar matching main portfolio */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #000000;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 9999px;
        border: 2px solid #000000;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.35);
      }

      @media (max-width: 768px) {
        html, body, *, *::before, *::after {
          -ms-overflow-style: none !important;
          scrollbar-width: none !important;
        }
        ::-webkit-scrollbar {
          display: none !important;
          width: 0 !important;
          height: 0 !important;
          background: transparent !important;
        }
        ::-webkit-scrollbar-thumb,
        ::-webkit-scrollbar-track {
          display: none !important;
          background: transparent !important;
        }
      }

      html, body {
        background-color: #000000;
        color: #ffffff;
        font-family: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
        scroll-behavior: smooth;
      }

      .font-display {
        font-family: 'Clash Display', 'OpenSans', sans-serif;
      }

      /* Frosted Navigation Bar */
      .navbar {
        position: fixed;
        top: 1.5rem;
        left: 0;
        right: 0;
        z-index: 50;
        display: flex;
        justify-content: center;
        padding: 0 1rem;
        pointer-events: none;
      }

      .nav-inner {
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: none;
        outline: none;
        border-radius: 999px;
        padding: 0.5rem 1.35rem;
        max-width: 900px;
        width: 100%;
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5);
      }

      .nav-brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
      }

      .nav-logo {
        height: 32px;
        width: auto;
        mix-blend-mode: screen;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .nav-link {
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.98rem;
        font-weight: 700;
        text-decoration: none;
        transition: color 0.2s, background-color 0.2s;
        padding: 0.48rem 1rem;
        border-radius: 999px;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        letter-spacing: -0.01em;
      }

      .nav-link:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.08);
      }

      .nav-cta {
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        font-family: 'OpenSans', 'Poppins', 'Clash Display', sans-serif;
        font-weight: 800;
        font-size: 0.875rem;
        padding: 0.45rem 1.15rem;
        border-radius: 999px;
        text-decoration: none;
        border: none;
        transition: background 0.2s, transform 0.2s, color 0.2s;
        letter-spacing: -0.01em;
      }

      .nav-cta:hover {
        background: rgba(255, 255, 255, 0.14);
        color: #ffffff;
        transform: scale(1.02);
      }

      /* Hero Section */
      .hero-section {
        position: relative;
        padding: 6.5rem 1.5rem 1rem;
        text-align: center;
        max-width: 1000px;
        margin: 0 auto;
        overflow: hidden;
      }

      .hero-glow {
        display: none !important;
      }

      .hero-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.95rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 0.78rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.85);
        margin-bottom: 1.5rem;
        backdrop-filter: blur(10px);
      }

      .hero-badge span.dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 8px #22c55e;
      }

      .hero-title {
        font-family: 'Clash Display', 'OpenSans', sans-serif;
        font-size: clamp(2.4rem, 6vw, 4.2rem);
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.05;
        margin-bottom: 1rem;
        color: #ffffff;
      }

      .hero-title span.italic-muted {
        font-style: italic;
        color: rgba(255, 255, 255, 0.55);
        font-weight: 400;
      }

      .hero-subtitle {
        font-size: clamp(0.95rem, 2vw, 1.15rem);
        color: rgba(255, 255, 255, 0.65);
        max-width: 620px;
        margin: 0 auto 2rem;
        line-height: 1.6;
      }

      /* Filter Tabs - Frosted Glass Style */
      .filters-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.6rem;
        flex-wrap: wrap;
        margin: 1.5rem auto 3rem;
        padding: 0 1rem;
        background: transparent;
        border: none;
        box-shadow: none;
      }

      .filter-btn {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
        border: 1px solid rgba(255, 255, 255, 0.07);
        color: rgba(255, 255, 255, 0.85);
        padding: 0.55rem 1.35rem;
        border-radius: 999px;
        font-size: 0.875rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.06), 0 2px 8px rgba(0, 0, 0, 0.2);
        letter-spacing: 0.01em;
      }

      .filter-btn:hover {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
        color: #ffffff;
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.12), 0 4px 14px rgba(0, 0, 0, 0.25);
        transform: translateY(-1px);
      }

      .filter-btn.active {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(240, 240, 248, 0.9) 100%);
        color: #0b0c10;
        font-weight: 800;
        border-color: rgba(255, 255, 255, 0.98);
        box-shadow: 0 4px 20px rgba(255, 255, 255, 0.25), inset 0 1px 1px #ffffff;
        transform: translateY(0);
      }

      /* Video Gallery Grid */
      .gallery-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1.5rem 5rem;
      }

      .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 2rem;
      }

      @media (max-width: 640px) {
        .navbar {
          padding: 1rem 1.25rem;
        }
        .nav-inner {
          padding: 0.45rem 1rem;
          gap: 1.25rem;
        }
        .nav-logo {
          height: 30px;
        }
        .nav-link {
          font-size: 0.9rem;
          padding: 0.45rem 0.95rem;
          font-weight: 700;
          white-space: nowrap;
        }
        .video-grid {
          grid-template-columns: 1fr;
          gap: 1.5rem;
        }
      }

      .video-card {
        background: rgba(255, 255, 255, 0.025);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 1.25rem;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.35s ease, box-shadow 0.35s ease;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .video-card:hover {
        transform: translateY(-5px);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(168, 85, 247, 0.15);
      }

      .thumbnail-wrap {
        position: relative;
        aspect-ratio: 16 / 9;
        width: 100%;
        overflow: hidden;
        background: #0d0d0d;
      }

      .thumbnail-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.4s ease;
      }

      .video-card:hover .thumbnail-img {
        transform: scale(1.04);
      }

      .thumbnail-gradient {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.2) 50%, transparent 100%);
        pointer-events: none;
      }

      .duration-badge {
        position: absolute;
        bottom: 0.75rem;
        right: 0.75rem;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.2rem 0.55rem;
        border-radius: 6px;
      }

      .category-badge {
        position: absolute;
        top: 0.75rem;
        left: 0.75rem;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.7rem;
        font-weight: 500;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .play-btn-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(3px);
        transition: opacity 0.3s ease;
      }

      .video-card:hover .play-btn-overlay {
        opacity: 1;
      }

      .play-icon-circle {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.95);
        color: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.4);
        transform: scale(0.85);
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .video-card:hover .play-icon-circle {
        transform: scale(1);
      }

      .card-info {
        padding: 1.15rem 1.25rem 1.25rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .video-title {
        font-family: 'Clash Display', 'OpenSans', sans-serif;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.3;
        margin-bottom: 0;
        color: #ffffff;
      }

      .video-description {
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.5;
        margin-bottom: 1rem;
        flex-grow: 1;
      }

      .card-meta-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        align-items: center;
      }

      .meta-tag {
        font-size: 0.72rem;
        color: rgba(255, 255, 255, 0.5);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.07);
        padding: 0.15rem 0.5rem;
        border-radius: 4px;
      }

      /* Modal / Lightbox Video Player */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.88);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .modal-backdrop.active {
        display: flex;
        opacity: 1;
      }

      .modal-content {
        background: #090909;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.5rem;
        max-width: 900px;
        width: 100%;
        overflow: hidden;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(168, 85, 247, 0.15);
        position: relative;
        transform: scale(0.95);
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .modal-backdrop.active .modal-content {
        transform: scale(1);
      }

      .modal-close-btn {
        position: absolute;
        top: 1rem;
        right: 1rem;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
        transition: background 0.2s, transform 0.2s;
      }

      .modal-close-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: scale(1.08);
      }

      .modal-player-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .modal-player-wrap video,
      .modal-player-wrap iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      .modal-details {
        padding: 1.5rem 2rem;
      }

      .modal-title {
        font-family: 'Clash Display', 'OpenSans', sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }

      .modal-desc {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 1.25rem;
      }

      .modal-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* Call to Action Footer Section */
      .cta-section {
        border-top: none;
        padding: 5rem 1.5rem;
        text-align: center;
        background: radial-gradient(circle at 50% 100%, rgba(30, 27, 75, 0.3) 0%, transparent 60%);
      }

      .cta-title {
        font-family: 'Clash Display', 'OpenSans', sans-serif;
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 1rem;
      }

      .cta-desc {
        color: rgba(255, 255, 255, 0.65);
        font-size: 1.05rem;
        max-width: 500px;
        margin: 0 auto 2rem;
      }

      .cta-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.95rem 2.25rem;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        color: #ffffff;
        font-family: 'OpenSans', 'Poppins', 'Clash Display', sans-serif;
        font-size: 1.05rem;
        font-weight: 800;
        text-decoration: none;
        backdrop-filter: blur(14px);
        transition: all 0.25s ease;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        letter-spacing: 0.03em;
      }

      .cta-btn:hover {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.35);
        transform: scale(1.03);
      }

      /* Footer */
      footer {
        padding: 3rem 1.5rem;
        text-align: center;
        border-top: none;
      }

      .footer-socials {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 1.5rem;
        margin-bottom: 1.5rem;
        list-style: none;
      }

      .footer-social-link {
        color: rgba(255, 255, 255, 0.6);
        text-decoration: none;
        font-size: 0.85rem;
        transition: color 0.2s;
      }

      .footer-social-link:hover {
        color: #ffffff;
      }

      .copyright-text {
        font-family: 'Clash Display', 'OpenSans', sans-serif;
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.4);
        letter-spacing: 0.04em;
      }

      /* Site Preloader Animation */
      #site-preloader {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000000;
        z-index: 99999999;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: all;
        transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.6s;
      }

      #site-preloader.preloader-hidden {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
        visibility: hidden;
      }

      .preloader-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }

      .preloader-glow {
        position: absolute;
        top: 35%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 220px;
        height: 220px;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.28) 0%, rgba(59, 130, 246, 0.18) 45%, transparent 70%);
        filter: blur(32px);
        pointer-events: none;
        animation: preloaderPulse 2.4s ease-in-out infinite alternate;
      }

      .preloader-logo {
        position: relative;
        width: 130px;
        max-width: 45vw;
        height: auto;
        mix-blend-mode: screen;
        user-select: none;
        pointer-events: none;
        animation: preloaderLogoAnim 2s ease-in-out infinite alternate;
      }

      .preloader-track {
        width: 110px;
        height: 2px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }

      .preloader-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, transparent 0%, #ffffff 50%, #a855f7 100%);
        border-radius: 999px;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        animation: preloaderProgress 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes preloaderLogoAnim {
        0% {
          transform: scale(0.96);
          filter: brightness(0.9) drop-shadow(0 0 12px rgba(255, 255, 255, 0.2));
        }
        100% {
          transform: scale(1.03);
          filter: brightness(1.08) drop-shadow(0 0 24px rgba(168, 85, 247, 0.45));
        }
      }

      @keyframes preloaderPulse {
        0% {
          opacity: 0.4;
          transform: translate(-50%, -50%) scale(0.85);
        }
        100% {
          opacity: 0.95;
          transform: translate(-50%, -50%) scale(1.2);
        }
      }

      @keyframes preloaderProgress {
        0% {
          left: -40%;
          width: 30%;
        }
        50% {
          width: 60%;
        }
        100% {
          left: 110%;
          width: 30%;
        }
      }
    </style>
  </head>
  <body>
    <div id="site-preloader" aria-hidden="true">
      <div class="preloader-content">
        <div class="preloader-glow"></div>
        <img src="./assets/falw-logo-new.png" alt="fre" class="preloader-logo" />
        <div class="preloader-track">
          <div class="preloader-bar"></div>
        </div>
      </div>

    <script>
      (function() {
        var startTime = Date.now();
        var minDisplayTime = 700;
        
        function dismissPreloader() {
          var preloader = document.getElementById('site-preloader');
          if (!preloader || preloader.classList.contains('preloader-hidden')) return;
          
          var elapsed = Date.now() - startTime;
          var delay = Math.max(0, minDisplayTime - elapsed);
          
          setTimeout(function() {
            preloader.classList.add('preloader-hidden');
            setTimeout(function() {
              if (preloader && preloader.parentNode) preloader.remove();
            }, 700);
          }, delay);
        }

        if (document.readyState === 'complete') {
          dismissPreloader();
        } else {
          window.addEventListener('load', dismissPreloader);
          setTimeout(dismissPreloader, 3500);
        }
      })();
    </script>

    <!-- ============================================================
         EASY VIDEO LIST & INTERACTIVE SCRIPT
         ============================================================ -->
    <script>
     
      /* ============================================================
       *  ADD YOUR VIDEOS HERE:
       *  Simply add objects to this array whenever you want to add videos!
       *
       *  EXAMPLE ENTRIES:
       *
       *  {
       *    title: "My Minecraft Gameplay Montage",
       *    description: "High-energy fast paced cuts with custom sound design.",
       *    category: "montage, long-form", // Categories: 'animation', 'montage', 'shorts', 'long-form', 'short-form', 'motion'
       *    tags: ["Premiere Pro", "Sound Design", "4K 60FPS"],
       *    thumbnail: "./assets/my-thumbnail.jpg", // Image file in assets folder or web URL
       *    video: "https://www.youtube.com/watch?v=YOUR_VIDEO_ID", // YouTube link, Shorts link, or ./assets/video.mp4
       *    duration: "2:30"
       *  },
       *
       *  {
       *    title: "Insane 1v1 Clutch Short",
       *    description: "Vertical short with kinetic subtitles and sound FX.",
       *    category: "shorts, short-form",
       *    tags: ["YouTube Shorts", "Kinetic Text", "After Effects"],
       *    thumbnail: "./assets/short-thumb.jpg",
       *    video: "https://youtube.com/shorts/YOUR_SHORT_ID",
       *    duration: "0:45"
       *  }
       * ============================================================ */

      const VIDEOS = [
        {
           title: "I Redesign Baablu Old Thumbnails",
           category: "short-form, motion", // Categories: 'animation', 'montage', 'shorts', 'long-form', 'short-form', 'motion'
           thumbnail: "./assets/maxresdefault (7).jpg", // Image file in assets folder or web URL
           video: "https://youtu.be/jWBkkh7l44s", // YouTube link, Shorts link, or ./assets/video.mp4
           duration: "1:28"
        },
        {
           title: "The H0nri 3K Pack",
           category: "short-form, montage", // Categories: 'animation', 'montage', 'shorts', 'long-form', 'short-form', 'motion'
           thumbnail: "./assets/maxresdefault (8).jpg", // Image file in assets folder or web URL
           video: "https://youtu.be/1zQTh0lnWKg", // YouTube link, Shorts link, or ./assets/video.mp4
           duration: "2:32"
       },
       {
           title: "Ultimate Fre - GFX PACK",
           category: "motion, short-form, animation", // Categories: 'animation', 'montage', 'shorts', 'long-form', 'short-form', 'motion'
           thumbnail: "./assets/maxresdefault (9).jpg", // Image file in assets folder or web URL
           video: "https://www.youtube.com/watch?v=0fcNuWkITuk", // YouTube link, Shorts link, or ./assets/video.mp4
           duration: "1:00"
       },
       {
           title: "https://www.youtube.com/watch?v=0fcNuWkITuk",
           category: "montage, short-from", // Categories: 'animation', 'montage', 'shorts', 'long-form', 'short-form', 'motion'
           thumbnail: "./assets/maxresdefault (10).jpg", // Image file in assets folder or web URL
           video: "https://www.youtube.com/watch?v=G-FagHMMcfM&pp=0gcJCRMMAYcqIYzv", // YouTube link, Shorts link, or ./assets/video.mp4
           duration: "1:00"
       
      ];

      (function() {
        const grid = document.getElementById('videoGrid');

        // Helper to convert YouTube / Shorts links into embed URLs
        function getEmbedUrl(url) {
          if (!url) return '';
          // YouTube Shorts: https://youtube.com/shorts/ID or https://www.youtube.com/shorts/ID
          const shortsMatch = url.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]+)/i);
          if (shortsMatch) return `https://www.youtube-nocookie.com/embed/${shortsMatch[1]}?autoplay=1&rel=0`;

          // Standard YouTube: https://www.youtube.com/watch?v=ID or https://youtu.be/ID
          const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/i);
          if (ytMatch) return `https://www.youtube-nocookie.com/embed/${ytMatch[1]}?autoplay=1&rel=0`;

          return url;
        }

        // Render videos from the VIDEOS array
        function renderVideos() {
          if (!grid) return;

          // If VIDEOS array has items, render them
          if (VIDEOS.length > 0) {
            grid.innerHTML = VIDEOS.map((v, i) => `
              <article class="video-card" 
                       data-category="${(v.category || 'all').toLowerCase()}" 
                       data-title="${v.title || 'Video Title'}" 
                       data-desc="${v.description || ''}" 
                       data-tags="${Array.isArray(v.tags) ? v.tags.join(', ') : (v.tags || '')}" 
                       data-thumb="${v.thumbnail || ''}" 
                       data-video="${v.video || ''}" 
                       data-duration="${v.duration || ''}">
                <div class="thumbnail-wrap">
                  ${v.thumbnail ? `<img src="${v.thumbnail}" alt="${v.title || 'Thumbnail'}" class="thumbnail-img" loading="lazy" />` : `<div style="width:100%;height:100%;background:#111;display:flex;align-items:center;justify-content:center;color:#444;font-size:0.85rem;">No Thumbnail</div>`}
                  <div class="thumbnail-gradient"></div>
                  ${v.duration ? `<div class="duration-badge">${v.duration}</div>` : ''}
                  <div class="play-btn-overlay">
                    <div class="play-icon-circle">
                      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                  </div>
                </div>
              </article>
            `).join('');
          } else {
            // Check if user has static HTML cards in the grid
            const staticCards = grid.querySelectorAll('.video-card');
            if (staticCards.length === 0) {
              // Clean empty placeholder state with instructions
              grid.innerHTML = `
                <div style="grid-column: 1 / -1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 4.5rem 1.5rem; text-align:center; background:rgba(255,255,255,0.015); border:1px dashed rgba(255,255,255,0.1); border-radius:1.5rem;">
                  <div style="width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; margin-bottom:1.25rem; color:rgba(255,255,255,0.5);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 10 4.553-2.276A1 1 0 0 1 21 8.618v6.764a1 1 0 0 1-1.447.894L15 14v-4z"/><rect width="14" height="12" x="1" y="6" rx="2" ry="2"/></svg>
                  </div>
                  <h3 style="font-size:1.15rem; font-weight:600; color:#fff; margin-bottom:0.5rem;">coming soon</h3>
                  <p style="font-size:0.875rem; color:rgba(255,255,255,0.5); max-width:440px; line-height:1.6; margin-bottom:1.5rem;">
                    coming soon
                </div>
              `;
            }
          }

          bindEvents();
        }

        function bindEvents() {
          // Category Filters
          const filterBtns = document.querySelectorAll('.filter-btn');
          const cards = document.querySelectorAll('.video-card');

          filterBtns.forEach(btn => {
            btn.onclick = () => {
              filterBtns.forEach(b => b.classList.remove('active'));
              btn.classList.add('active');

              const category = btn.getAttribute('data-category');
              cards.forEach(card => {
                const cardCatStr = card.getAttribute('data-category') || '';
                const cardCats = cardCatStr.split(',').map(c => c.trim().toLowerCase());
                if (category === 'all' || cardCats.includes(category) || cardCatStr === category) {
                  card.style.display = 'flex';
                } else {
                  card.style.display = 'none';
                }
              });
            };
          });

          // Modal Player Lightbox
          const modal = document.getElementById('videoModal');
          const modalCloseBtn = document.getElementById('modalCloseBtn');
          const playerWrap = document.getElementById('playerWrap');
          const modalTitle = document.getElementById('modalTitle');
          const modalDesc = document.getElementById('modalDesc');
          const modalTags = document.getElementById('modalTags');

          cards.forEach(card => {
            card.onclick = () => {
              const title = card.getAttribute('data-title') || 'Video Showcase';
              const desc = card.getAttribute('data-desc') || '';
              const tags = (card.getAttribute('data-tags') || '').split(',');
              const thumb = card.getAttribute('data-thumb') || '';
              const videoSrc = card.getAttribute('data-video') || '';

              modalTitle.textContent = title;
              modalDesc.textContent = desc;

              // Clear & populate tags
              modalTags.innerHTML = '';
              tags.forEach(t => {
                if (t.trim()) {
                  const span = document.createElement('span');
                  span.className = 'meta-tag';
                  span.textContent = t.trim();
                  modalTags.appendChild(span);
                }
              });

              // Populate player wrap with real video, YouTube iframe, or preview
              if (videoSrc) {
                const embedUrl = getEmbedUrl(videoSrc);
                if (embedUrl.includes('youtube') || embedUrl.includes('embed') || embedUrl.includes('player.vimeo')) {
                  playerWrap.innerHTML = `
                    <div style="position:relative;width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;">
                      <iframe src="${embedUrl}" style="width:100%;height:100%;border:none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                    </div>
                  `;
                } else {
                  playerWrap.innerHTML = `
                    <div style="position:relative;width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;">
                      <video src="${videoSrc}" poster="${thumb}" controls autoplay loop playsinline style="width:100%;height:100%;max-height:100%;object-fit:contain;background:#000;outline:none;border-radius:4px;"></video>
                    </div>
                  `;
                }
              } else if (thumb) {
                playerWrap.innerHTML = `
                  <div style="position:relative;width:100%;height:100%;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;">
                    <img src="${thumb}" alt="${title}" style="width:100%;height:100%;object-fit:contain;filter:brightness(0.95);" />
                  </div>
                `;
              } else {
                playerWrap.innerHTML = `
                  <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.4);font-size:0.9rem;">
                    No video source specified
                  </div>
                `;
              }

              modal.classList.add('active');
              document.body.style.overflow = 'hidden';
            };
          });

          function closeModal() {
            modal.classList.remove('active');
            playerWrap.innerHTML = '';
            document.body.style.overflow = '';
          }

          if (modalCloseBtn) modalCloseBtn.onclick = closeModal;
          if (modal) {
            modal.onclick = (e) => {
              if (e.target === modal) closeModal();
            };
          }

          document.onkeydown = (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
              closeModal();
            }
          };
        }

        renderVideos();
      })();
    </script>
